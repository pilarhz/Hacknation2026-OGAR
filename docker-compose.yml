services:
  # Baza danych: PostgreSQL 17. Hasło można nadpisać zmienną POSTGRES_PASSWORD (np. w pliku .env obok tego pliku).
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ogar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ogar_lokalnie}
      POSTGRES_DB: ogar
    volumes:
      - ogar-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogar -d ogar"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Port bazy nie jest wystawiany na hosta – dostęp ma tylko kontener api.

  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://ogar:${POSTGRES_PASSWORD:-ogar_lokalnie}@postgres:5432/ogar
      SANDBOX_URL: http://sandbox:4100
      # AI_PROVIDER: openai-compatible
      # AI_BASE_URL: http://ollama:11434/v1
    depends_on:
      postgres:
        condition: service_healthy
      sandbox:
        condition: service_started

  sandbox:
    build: .
    command: ["node", "apps/sandbox/server.ts"]
    environment:
      SANDBOX_HOST: 0.0.0.0
      SANDBOX_PORT: "4100"
      SANDBOX_PUBLIC_URL: http://sandbox:4100
    ports:
      - "127.0.0.1:4100:4100"

  # Opcjonalnie: lokalny model AI (bez wysyłania danych poza infrastrukturę)
  # ollama:
  #   image: ollama/ollama:0.9.0
  #   volumes: [ollama:/root/.ollama]

volumes:
  ogar-pg:
