<!doctype html>
<html lang="pl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280" />
    <title>OGAR</title>
    <link rel="icon" type="image/svg+xml" href="/ogar.svg" />
    <script>
      // Motyw ustawiany przed pierwszym renderem (bez mignięcia tła). Domyślnie jasny; logika jak w src/theme.ts.
      (function () {
        try {
          if (localStorage.getItem('ogar-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
