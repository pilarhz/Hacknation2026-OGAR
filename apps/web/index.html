<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280" />
    <title>OGAR – OSINTowy Gończy Adresów i Rejestrów</title>
    <link rel="icon" type="image/svg+xml" href="/ogar.svg" />
    <script>
      // Motyw ustawiany przed pierwszym renderem (bez mignięcia jasnego tła). Logika jak w src/theme.ts.
      (function () {
        var c = 'system';
        try { c = localStorage.getItem('ogar-theme') || 'system'; } catch (e) {}
        var dark = c === 'dark' || (c !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
